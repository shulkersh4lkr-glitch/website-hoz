  <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интернет-каталог товаров</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <h1>Каталог</h1>
        <p>Лучший выбор для вашей кухни</p>
      </div>
      <div class="controls">
        <button id="themeToggleCheckbox" class="btn btn-switch" type="button" aria-label="Переключить тему">🌙 Тема</button>
        <button id="cartOpenBtn" class="btn btn-cart" type="button" aria-label="Открыть корзину">🛒 Корзина <span id="cartCount">0</span></button>
      </div>
    </header>

    <section class="actions">
      <input id="searchInput" class="input-search" type="search" placeholder="Поиск по названию или описанию товара" aria-label="Поиск товаров" />
      <div class="filter-buttons" aria-label="Фильтр по категории">
        <select id="categoryFilter" class="category-filter">
          <option value="all">Все категории</option>
          <option value="food">Продукты</option>
          <option value="kitchen">Кухонная посуда</option>
          <option value="decor">Декор</option>
        </select>
      </div>
    </section>

    <section class="catalog" aria-live="polite" aria-label="Каталог товаров">
      <div id="cards" class="cards"></div>
      <div id="emptyMessage" class="empty-message hidden">Товары не найдены</div>
    </section>
  </div>

  <div id="cartPanel" class="cart-panel" role="dialog" aria-modal="true" aria-label="Корзина" aria-hidden="true">
    <div class="cart-content">
      <header class="cart-header">
        <h2>Ваша корзина</h2>
        <button id="cartCloseBtn" class="btn btn-close" type="button" aria-label="Закрыть корзину">✕</button>
      </header>
      <div class="cart-body">
        <ul id="cartItems" class="cart-items"></ul>
        <div class="cart-footer">
          <span>Итого:</span>
          <strong id="cartTotal">0 ₸</strong>
        </div>
      </div>
    </div>
    <div id="cartOverlay" class="overlay" hidden></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
